spring.application.name=angsamo-erp

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

kma.api-key=${KMA_API_KEY:}
kma.nx=60
kma.ny=127
kma.warning-region=11B10101
kma.stn=108

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
safety.upload-dir=${SAFETY_UPLOAD_DIR:./uploads/safety}
helmet.detection-api-url=${HELMET_API_URL:http://localhost:5001/helmet/predict}
weather.risk-api-url=${WEATHER_RISK_API_URL:http://localhost:5001/weather/predict}

cctv.api-base-url=${CCTV_API_BASE_URL:http://localhost:5001}
cctv.rtsp-url=${CCTV_RTSP_URL:}